<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>TOUS les JOURS - 아그작 케이크 예약</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <style>
      :root {
        --page: #ffffff;
        --card: #fff6ef;
        --field: #ffffff;
        --text: #1f1d1b;
        --muted: #8c837c;
        --line: #eae0d6;
        --brand: #005a34;
        --brand-soft: #e8f1ec;
        --danger: #b42318;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          "Pretendard",
          "Pretendard Variable",
          -apple-system,
          system-ui,
          "Noto Sans JP",
          "Noto Sans SC",
          sans-serif;
        background: var(--page);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 32px 18px 48px;
        word-break: keep-all;
        overflow-wrap: break-word;
      }
      .wrap {
        width: 100%;
        max-width: 400px;
      }

      header.top {
        display: flex;
        justify-content: center;
        margin: 0 0 26px;
      }
      header.top img {
        height: 26px;
        width: auto;
        display: block;
      }

      .card {
        background: var(--card);
        border-radius: 20px;
        padding: 30px 24px;
        border: 1px solid var(--line);
      }

      .title {
        font-size: 20px;
        font-weight: 700;
        margin: 0 0 26px;
        letter-spacing: -0.4px;
        line-height: 1.35;
      }

      .field {
        display: block;
        margin-bottom: 22px;
      }
      .field .lab {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 8px;
        color: var(--muted);
      }
      .labrow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 0 0 8px;
      }
      .labrow .lab {
        margin: 0;
      }
      input[type="text"],
      input[type="tel"] {
        width: 100%;
        border: 1px solid var(--line);
        background: var(--field);
        border-radius: 12px;
        padding: 14px 15px;
        font-size: 16px;
        font-family: inherit;
        color: var(--text);
        outline: none;
        transition: 0.15s;
      }
      input:focus {
        border-color: var(--brand);
      }
      input::placeholder {
        color: #c4bbb3;
      }
      input#entryCode {
        text-align: center;
        letter-spacing: 10px;
        font-weight: 700;
        font-size: 18px;
      }
      input#entryCode::placeholder {
        letter-spacing: normal;
        font-weight: 500;
        font-size: 15px;
      }

      /* ---- 종류 (과일별 색 분류 + 수량) ---- */
      .types {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-auto-rows: 60px;
        gap: 10px;
      }
      .type {
        position: relative;
        box-sizing: border-box;
        height: 100%;
        border: 1px solid var(--f-bd);
        border-radius: 12px;
        padding: 0 10px;
        text-align: center;
        cursor: pointer;
        background: var(--field);
        transition: 0.15s;
        user-select: none;
        font-size: 15px;
        font-weight: 600;
        color: var(--f-tx);
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1.2;
      }
      .type[data-k="peach"] {
        --f-bd: #f1bcae;
        --f-tx: #b0523d;
        --f-on: #ffe0d6;
      }
      .type[data-k="mango"] {
        --f-bd: #efc673;
        --f-tx: #9e6c08;
        --f-on: #ffebc6;
      }
      .type[data-k="lemon"] {
        --f-bd: #dcd167;
        --f-tx: #7c7108;
        --f-on: #f5f2bf;
      }
      .type[data-k="melon"] {
        --f-bd: #a8cd99;
        --f-tx: #48753b;
        --f-on: #dbedd2;
      }
      .type.on {
        background: var(--f-on);
        box-shadow: 0 0 0 2px var(--f-bd);
        font-weight: 700;
      }
      .type .q {
        position: absolute;
        top: 7px;
        right: 8px;
        min-width: 20px;
        height: 20px;
        padding: 0 6px;
        border-radius: 10px;
        background: var(--f-tx);
        color: #fff;
        font-size: 11.5px;
        font-weight: 700;
        display: none;
        align-items: center;
        justify-content: center;
        line-height: 1;
      }
      .type.on .q {
        display: flex;
      }
      .type.closed {
        background: #f6f4f2;
        border-color: var(--line);
        color: var(--muted);
        pointer-events: none;
        box-shadow: none;
      }
      .type.closed .q {
        display: flex;
        background: var(--muted);
      }

      /* ---- 픽업 시간 ---- */
      .timeToggle {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border: 1px solid var(--line);
        background: var(--field);
        border-radius: 12px;
        padding: 13px 15px;
        font-size: 14.5px;
        font-weight: 600;
        color: var(--text);
        cursor: pointer;
        font-family: inherit;
        transition: 0.15s;
      }
      .timeToggle .ph {
        color: var(--muted);
        font-weight: 500;
      }
      .timeToggle.chosen {
        border-color: var(--brand);
        background: var(--brand-soft);
        color: var(--brand);
      }
      .timeToggle .chev {
        transition: transform 0.15s;
        font-size: 12px;
        color: var(--muted);
      }
      .timeToggle.open .chev {
        transform: rotate(180deg);
      }
      .slots {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 8px;
      }
      .slot {
        border: 1px solid var(--line);
        background: var(--field);
        border-radius: 10px;
        padding: 11px 4px;
        text-align: center;
        font-size: 13.5px;
        font-weight: 600;
        color: var(--text);
        cursor: pointer;
        user-select: none;
        transition: 0.15s;
        font-variant-numeric: tabular-nums;
      }
      .slot.past {
        color: #c9c1b9;
        background: #f6f4f2;
        border-color: var(--line);
        pointer-events: none;
        text-decoration: line-through;
      }
      .slot.on {
        border-color: var(--brand);
        background: var(--brand-soft);
        color: var(--brand);
        box-shadow: 0 0 0 1px var(--brand);
      }

      /* ---- 포장(가방) ---- */
      .mini {
        border: 1px solid var(--line);
        background: var(--field);
        border-radius: 9px;
        padding: 6px 11px;
        font-size: 11.5px;
        font-family: inherit;
        font-weight: 600;
        color: var(--muted);
        cursor: pointer;
        white-space: nowrap;
      }
      .mini:active {
        opacity: 0.75;
      }
      .bags {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .bag {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border: 1px solid var(--line);
        background: var(--field);
        border-radius: 12px;
        padding: 13px 15px;
        cursor: pointer;
        transition: 0.15s;
        user-select: none;
      }
      .bag .bn {
        font-size: 14.5px;
        font-weight: 600;
      }
      .bag .bp {
        font-size: 12px;
        color: var(--muted);
        margin-left: 7px;
        font-weight: 500;
      }
      .bag .bq {
        min-width: 24px;
        height: 24px;
        padding: 0 7px;
        border-radius: 12px;
        font-size: 12.5px;
        font-weight: 700;
        display: grid;
        place-items: center;
        color: transparent;
        background: transparent;
        transition: 0.15s;
      }
      .bag.on {
        border-color: var(--brand);
        background: var(--brand-soft);
      }
      .bag.on .bn {
        color: var(--brand);
      }
      .bag.on .bq {
        background: var(--brand);
        color: #fff;
      }
      .bag.off {
        opacity: 0.42;
        pointer-events: none;
      }
      .labActions {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .icepackChip {
        width: auto;
        justify-content: center;
        gap: 6px;
        padding: 6px 11px;
        border-radius: 9px;
      }
      .icepackChip:not(.on) .bq {
        display: none;
      }
      .icepackChip .bn {
        font-size: 11.5px;
        font-weight: 600;
        color: var(--muted);
      }
      .icepackChip.on .bn {
        color: var(--brand);
      }
      .icepackChip .bq {
        min-width: 17px;
        height: 17px;
        padding: 0 5px;
        border-radius: 9px;
        font-size: 10.5px;
      }
      .subnote {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.6;
        margin: 10px 2px 0;
      }
      .subnote.strong {
        color: var(--brand);
        font-weight: 600;
      }
      .dayNotice {
        border: 1px solid #f0c98a;
        background: #fff6e6;
        color: #8a5a00;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 13px;
        line-height: 1.55;
        font-weight: 600;
        margin: 0 0 20px;
      }
      .resNotice {
        margin: 14px 0 0;
        padding: 11px 12px;
        border-radius: 10px;
        background: var(--brand-soft);
        color: var(--brand);
        font-size: 13px;
        font-weight: 600;
        line-height: 1.5;
        text-align: center;
      }
      .subnote.warn {
        color: #a9660a;
        font-weight: 500;
      }

      /* ---- 개인정보 동의 ---- */
      .consent {
        border: 1px solid var(--line);
        background: var(--field);
        border-radius: 12px;
        padding: 14px 15px;
        margin-bottom: 4px;
      }
      .consent .crow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .chk {
        display: flex;
        align-items: center;
        gap: 9px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.5;
        color: var(--text);
      }
      .chk input {
        appearance: none;
        -webkit-appearance: none;
        flex: none;
        width: 19px;
        height: 19px;
        margin: 0;
        border: 1.5px solid var(--line);
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
        transition: 0.15s;
        position: relative;
      }
      .chk input:checked {
        background: var(--brand);
        border-color: var(--brand);
      }
      .chk input:checked::after {
        content: "";
        position: absolute;
        left: 5.5px;
        top: 1.5px;
        width: 5px;
        height: 10px;
        border: solid #fff;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
      }
      .cbody {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
        font-size: 12.5px;
        color: var(--muted);
        line-height: 1.8;
      }
      .cbody a {
        color: var(--brand);
        font-weight: 600;
      }

      .totalbox {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 16px;
        padding: 14px 16px;
        border: 1px solid var(--brand);
        background: var(--brand-soft);
        border-radius: 12px;
      }
      .totalbox .tl {
        font-size: 13px;
        font-weight: 600;
        color: var(--brand);
      }
      .totalbox .tv {
        font-size: 18px;
        font-weight: 700;
        color: var(--brand);
        white-space: nowrap;
      }

      .btn {
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 15px;
        font-size: 16px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: 0.15s;
        color: #fff;
        background: var(--brand);
        margin-top: 8px;
      }
      .btn:active {
        opacity: 0.85;
      }
      .btn[disabled] {
        opacity: 0.4;
        pointer-events: none;
      }
      .btn.ghost {
        background: none;
        color: var(--muted);
        font-weight: 500;
        font-size: 14px;
        margin-top: 10px;
        padding: 12px;
      }

      .hint {
        font-size: 12.5px;
        color: #c0392b;
        margin: 8px 2px 0;
        min-height: 16px;
        line-height: 1.5;
      }
      .hidden {
        display: none !important;
      }

      /* 결과 */
      .state {
        font-size: 13px;
        font-weight: 600;
        color: var(--brand);
        margin: 0 0 14px;
        letter-spacing: 0.2px;
      }
      .state.gray {
        color: var(--muted);
      }
      .state.red {
        color: var(--danger);
      }
      .ticketBig {
        font-size: 68px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -3px;
        margin: 0 0 26px;
        color: var(--brand);
      }
      .ticketBig.off {
        color: var(--muted);
        text-decoration: line-through;
        text-decoration-thickness: 4px;
      }
      .rows {
        border-top: 1px solid var(--line);
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 14px;
        padding: 13px 0;
        font-size: 15px;
        border-bottom: 1px solid var(--line);
      }
      .row:last-child {
        border-bottom: none;
      }
      .row .k {
        color: var(--muted);
        font-size: 13.5px;
        white-space: nowrap;
      }
      .row .v {
        font-weight: 600;
        text-align: right;
        line-height: 1.5;
      }
      .note {
        margin-top: 22px;
        margin-bottom: 0;
        font-size: 13.5px;
        color: var(--muted);
        line-height: 1.65;
      }
      .doneNote {
        text-align: center;
        font-size: 12px;
        color: var(--muted);
        margin: 9px 0 0;
        line-height: 1.6;
      }

      /* 마감 */
      .closed {
        padding: 44px 26px;
        text-align: center;
      }
      .closed .ct {
        font-size: 19px;
        font-weight: 700;
        margin: 0 0 12px;
        letter-spacing: -0.3px;
        line-height: 1.45;
      }
      .closed .cb {
        font-size: 14.5px;
        color: var(--muted);
        margin: 0;
        line-height: 1.7;
      }

      .foot {
        text-align: center;
        font-size: 12px;
        color: #b8afa8;
        margin-top: 20px;
        line-height: 1.6;
      }

      /* 확인창 */
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(31, 29, 27, 0.45);
        display: none;
        place-items: center;
        z-index: 60;
        padding: 20px;
      }
      .modal.on {
        display: grid;
      }
      .modal .box {
        background: #fff;
        border-radius: 16px;
        padding: 26px 24px;
        max-width: 330px;
        width: 100%;
        text-align: center;
        border: 1px solid var(--line);
      }
      .modal h3 {
        margin: 0 0 10px;
        font-size: 16.5px;
        font-weight: 700;
      }
      .modal .msg {
        margin: 0 0 20px;
        font-size: 13.5px;
        color: var(--muted);
        line-height: 1.7;
      }
      .modal .mbtns {
        display: flex;
        gap: 8px;
      }
      .modal .mbtns .btn {
        margin-top: 0;
        padding: 13px;
        font-size: 14.5px;
      }
      .modal .mbtns .btn.gray {
        background: #fff;
        color: var(--muted);
        border: 1px solid var(--line);
      }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(255, 255, 255, 0.7);
        display: grid;
        place-items: center;
        z-index: 50;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 3px solid var(--line);
        border-top-color: var(--brand);
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .fade {
        animation: fade 0.3s ease;
      }
      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="top"><img src="/src/logo.png" alt="" /></header>

      <!-- 마감 안내 -->
      <section id="screen-closed" class="card closed fade hidden">
        <p class="ct" id="t-closedTitle"></p>
        <p class="cb" id="t-closedBody"></p>
      </section>

      <!-- STEP 1 : 전화번호 + 동의 -->
      <section id="screen-phone" class="card fade hidden">
        <div class="dayNotice hidden" id="dayNotice"></div>
        <h2 class="title" id="t-phoneTitle"></h2>
        <label class="field">
          <span class="lab" id="t-phoneLabel"></span>
          <input id="phone" type="tel" inputmode="numeric" autocomplete="tel" />
          <p class="subnote" id="t-noticePhoneReal"></p>
        </label>

        <div class="consent">
          <div class="crow">
            <label class="chk">
              <input type="checkbox" id="agree" />
              <span id="t-consentLabel"></span>
            </label>
            <button type="button" class="mini" id="consentToggle"></button>
          </div>
          <div class="cbody hidden" id="consentBody"></div>
        </div>

        <div class="hint" id="phoneHint"></div>
        <button class="btn" id="phoneBtn"></button>
      </section>

      <!-- STEP 2 : 종류 + 포장 + 픽업 시간 -->
      <section id="screen-form" class="card fade hidden">
        <h2 class="title" id="t-infoTitle"></h2>

        <div class="field">
          <div class="types">
            <div class="type" data-k="peach">
              <span class="tn" id="t-peach"></span><span class="q"></span>
            </div>
            <div class="type" data-k="mango">
              <span class="tn" id="t-mango"></span><span class="q"></span>
            </div>
            <div class="type" data-k="lemon">
              <span class="tn" id="t-lemon"></span><span class="q"></span>
            </div>
            <div class="type" data-k="melon">
              <span class="tn" id="t-melon"></span><span class="q"></span>
            </div>
          </div>
          <p class="subnote" id="t-cakePriceNote"></p>
          <p class="subnote strong" id="t-noticeMaxPerPerson"></p>
        </div>

        <div class="field">
          <div class="labrow">
            <span class="lab" id="t-bagLabel"></span>
            <div class="labActions">
              <div id="icepackSlot"></div>
              <button type="button" class="mini" id="bagReset"></button>
            </div>
          </div>
          <div class="bags" id="bags"></div>
          <p class="subnote" id="t-bagNoteFruitbox"></p>
          <p class="subnote" id="t-bagNoteIcepack"></p>
          <p class="subnote warn hidden" id="bagNoteCooler"></p>
        </div>

        <div class="field">
          <span class="lab" id="t-pickupTimeLabel"></span>
          <button type="button" class="timeToggle" id="timeToggle">
            <span class="ph" id="timeToggleText"></span>
            <span class="chev">▾</span>
          </button>
          <div class="slots hidden" id="slots"></div>
          <p class="subnote" id="t-pickupTimeNote"></p>
        </div>

        <div class="totalbox">
          <span class="tl" id="t-estTotal"></span>
          <span class="tv" id="estTotal"></span>
        </div>

        <div class="hint" id="formHint"></div>
        <button class="btn" id="formBtn"></button>
        <button class="btn ghost" id="formBack"></button>
      </section>

      <!-- STEP 3 : 입장코드 -->
      <section id="screen-code" class="card fade hidden">
        <h2 class="title" id="t-codeTitle"></h2>
        <label class="field">
          <span class="lab" id="t-codeLabel"></span>
          <input
            id="entryCode"
            type="tel"
            inputmode="numeric"
            maxlength="4"
            autocomplete="off"
          />
        </label>
        <div class="totalbox">
          <span class="tl" id="t-estTotal2"></span>
          <span class="tv" id="estTotal2"></span>
        </div>
        <div class="hint" id="codeHint"></div>
        <button class="btn" id="codeBtn"></button>
        <button class="btn ghost" id="codeBack"></button>
      </section>

      <!-- 결과 -->
      <section id="screen-result" class="card fade hidden"></section>

      <p class="foot hidden" id="t-footer"></p>
    </div>

    <div class="modal" id="confirmModal">
      <div class="box">
        <h3 id="cfTitle"></h3>
        <p class="msg" id="cfMsg"></p>
        <div class="mbtns">
          <button class="btn gray" id="cfCancel"></button>
          <button class="btn" id="cfOk"></button>
        </div>
      </div>
    </div>

    <div id="overlay" class="overlay"><div class="spinner"></div></div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getFirestore,
        doc,
        getDoc,
        onSnapshot,
        runTransaction,
        serverTimestamp,
        updateDoc,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
      import {
        firebaseConfig,
        PICKUP_HOUR,
        FRUITS,
        FRUIT_LIMITS,
        BAGS,
        COOLER_CAPACITY,
        ICEPACK_INCLUDED,
        CAKE_PRICE,
        MAX_PER_TYPE,
        ID_SALT,
        RETENTION_DAYS,
        PICKUP_SLOT_START,
        PICKUP_SLOT_END,
        PICKUP_SLOT_STEP_MIN,
        CANCEL_GRACE_MIN,
        PURGE_HOUR,
        RESERVE_CUTOFF_HOUR,
        ONSITE_SALE_HOUR,
        STORES,
        DEFAULT_STORE,
      } from "/firebase-config.js?v=9";
      import { detectLang, getMessages, LOCALE } from "/i18n.js?v=9";

      /* ---------- 언어 ---------- */
      const LANG = detectLang();
      const T = getMessages(LANG);
      const LOC = LOCALE[LANG] || "en-US";
      document.documentElement.lang = T.htmlLang;
      document.title = "TOUS les JOURS - 아그작 케이크 예약";

      const $ = (id) => document.getElementById(id);
      const setTxt = (id, v) => {
        const el = $(id);
        if (el) el.textContent = v ?? "";
      };
      const setHtml = (id, v) => {
        const el = $(id);
        if (el) el.innerHTML = v ?? "";
      };

      const FRUIT_NAME = {
        peach: T.peach,
        mango: T.mango,
        lemon: T.lemon,
        melon: T.melon,
      };
      const BAG_NAME = {
        free: T.bagFree,
        shopping: T.bagShopping,
        cooler: T.bagCooler,
        icepack: T.bagIcepack,
        fruitbox: T.bagFruitbox,
      };
      const FRUITBOX_PER = (BAGS.find((b) => b.k === "fruitbox") || {}).perCakes || 4;

      setTxt("t-phoneTitle", T.infoTitle);
      setTxt("t-phoneLabel", T.phoneLabel);
      setTxt("t-infoTitle", T.typeLabel);
      FRUITS.forEach((f) => setTxt("t-" + f, FRUIT_NAME[f]));
      setHtml(
        "t-cakePriceNote",
        T.cakePriceNote(T.priceFmt(CAKE_PRICE), MAX_PER_TYPE),
      );
      setTxt("t-bagLabel", T.bagLabel);
      setTxt("bagReset", T.bagReset);
      setHtml("t-bagNoteFruitbox", T.bagNoteFruitbox(FRUITBOX_PER));
      setHtml("t-bagNoteIcepack", T.bagNoteIcepack(ICEPACK_INCLUDED));
      setHtml("bagNoteCooler", T.bagNoteCooler(COOLER_CAPACITY));
      setTxt("t-pickupTimeLabel", T.pickupTimeLabel);
      setHtml("t-pickupTimeNote", T.pickupTimeNote(CANCEL_GRACE_MIN));
      setTxt("t-estTotal", T.estTotal);
      setTxt("t-estTotal2", T.estTotal);
      setTxt("t-codeTitle", T.codeLabel);
      setTxt("t-codeLabel", T.codeLabel);
      setTxt("t-consentLabel", T.consentLabel);
      setTxt("consentToggle", T.consentView);
      setHtml(
        "consentBody",
        T.consentBody(RETENTION_DAYS) +
          `<br><a href="/privacy.html" target="_blank" rel="noopener">${T.privacyLink}</a>`,
      );
      setTxt("phoneBtn", T.confirm);
      setTxt("formBtn", T.next);
      setTxt("formBack", T.back);
      setTxt("codeBtn", T.issue);
      setTxt("codeBack", T.back);
      setTxt("cfOk", T.confirm);
      setTxt("cfCancel", T.cancel);
      setTxt("t-footer", T.footer(PICKUP_HOUR));
      setTxt("t-closedTitle", T.closedTitle);
      setTxt("t-closedBody", T.closedBody);
      setTxt("t-noticePhoneReal", T.noticePhoneReal);
      setTxt(
        "t-noticeMaxPerPerson",
        T.noticeMaxPerPerson(MAX_PER_TYPE * FRUITS.length, MAX_PER_TYPE),
      );
      $("phone").placeholder = T.phonePlaceholder;
      $("entryCode").placeholder = T.codePlaceholder;

      /* ---------- 포장 목록 (아이스팩은 '선택 초기화' 왼쪽 칩으로 표시) ---------- */
      $("bags").innerHTML = BAGS.filter((b) => b.k !== "icepack")
        .map(
          (b) => `
  <div class="bag" data-b="${b.k}">
    <span class="bi"><span class="bn">${BAG_NAME[b.k]}</span><span class="bp">${b.price ? T.priceFmt(b.price) : T.freeText}</span></span>
    <span class="bq"></span>
  </div>`,
        )
        .join("");
      $("icepackSlot").innerHTML = `
  <div class="bag icepackChip" data-b="icepack">
    <span class="bn">${BAG_NAME.icepack}</span>
    <span class="bq"></span>
  </div>`;

      /* ---------- 픽업 시간 슬롯 ---------- */
      const SLOTS = [];
      for (
        let m = PICKUP_SLOT_START * 60;
        m <= PICKUP_SLOT_END * 60;
        m += PICKUP_SLOT_STEP_MIN
      ) {
        SLOTS.push(
          `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`,
        );
      }
      $("slots").innerHTML = SLOTS.map(
        (s) => `<div class="slot" data-t="${s}">${s}</div>`,
      ).join("");
      setTxt("timeToggleText", T.pickupTimeChoose);

      /* ---------- Firebase ---------- */
      let db;
      try {
        db = getFirestore(initializeApp(firebaseConfig));
      } catch (e) {
        console.error(e);
        alert("Firebase 설정을 확인해 주세요. (firebase-config.js)");
      }

      /* ---------- 유틸 ---------- */
      const overlay = $("overlay");
      const show = (el) => el.classList.remove("hidden");
      const hide = (el) => el.classList.add("hidden");
      const busy = (on) => overlay.classList.toggle("hidden", !on);

      function todayStr(d = new Date()) {
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      }
      const digits = (s) => (s || "").replace(/\D/g, "");

      /* ---------- 점포(매장) 판별 ----------
         주소 경로(/gangnam)에서 먼저 찾고, 없으면 ?store=gangnam,
         그래도 없으면 기본 점포를 씁니다. */
      function detectStore() {
        const seg = (location.pathname || "")
          .split("/")
          .filter(Boolean)
          .map((x) => x.toLowerCase());
        for (const x of seg) if (STORES[x]) return x;
        const q = (new URLSearchParams(location.search).get("store") || "")
          .trim()
          .toLowerCase();
        if (STORES[q]) return q;
        return DEFAULT_STORE;
      }
      const STORE = detectStore();
      const STORE_LABEL = (STORES[STORE] || {}).name || STORE;
      // 번호표 : tickets / {점포} / {날짜} / {번호표}
      const ticketRefOf = (date, id) => doc(db, "tickets", STORE, date, id);
      // 수량·마감 : counters / {점포}_{날짜}
      const counterRefOf = (date) => doc(db, "counters", `${STORE}_${date}`);
      function fmtPhone(s) {
        const d = digits(s);
        if (d.length >= 11)
          return `${d.slice(0, 3)}-${d.slice(3, 7)}-${d.slice(7, 11)}`;
        if (d.length === 10)
          return `${d.slice(0, 3)}-${d.slice(3, 6)}-${d.slice(6)}`;
        return s;
      }
      function fmtTime(ts) {
        if (!ts) return "—";
        const d = ts?.toDate
          ? ts.toDate()
          : ts instanceof Date
            ? ts
            : new Date(ts);
        return d.toLocaleTimeString(LOC, {
          hour: "2-digit",
          minute: "2-digit",
        });
      }
      const esc = (s) =>
        (s || "").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      function itemText(items) {
        const parts = FRUITS.filter((f) => (items?.[f] || 0) > 0).map((f) =>
          items[f] > 1 ? `${FRUIT_NAME[f]} ×${items[f]}` : FRUIT_NAME[f],
        );
        return parts.join(", ");
      }
      function bagText(b) {
        const parts = BAGS.map((x) => x.k)
          .filter((k) => (b?.[k] || 0) > 0)
          .map((k) => (b[k] > 1 ? `${BAG_NAME[k]} ×${b[k]}` : BAG_NAME[k]));
        return parts.length ? parts.join(", ") : T.bagNone;
      }
      const cakeCount = (items) =>
        FRUITS.reduce((a, f) => a + (items?.[f] || 0), 0);
      function calcTotal(items, bags) {
        let sum = cakeCount(items) * CAKE_PRICE;
        BAGS.forEach((b) => {
          sum += (bags?.[b.k] || 0) * b.price;
        });
        return sum;
      }
      function restartFade(el) {
        el.classList.remove("fade");
        void el.offsetWidth;
        el.classList.add("fade");
      }
      const gen4 = () => String(Math.floor(1000 + Math.random() * 9000));

      /* 번호표 문서 ID — 전화번호가 그대로 드러나지 않도록 섞어서 만듭니다. */
      function mix(s) {
        let a = 0x811c9dc5,
          b = 0x1000193,
          c = 0x9e3779b9,
          d = 0x85ebca6b;
        for (let i = 0; i < s.length; i++) {
          const ch = s.charCodeAt(i);
          a = Math.imul(a ^ ch, 16777619) >>> 0;
          b = ((b << 5) + b + ch) >>> 0;
          c = Math.imul(c ^ (ch + i), 2654435761) >>> 0;
          d = ((d << 7) ^ (d >>> 3) ^ ch) >>> 0;
        }
        return [a, b, c, d].map((x) => x.toString(16).padStart(8, "0")).join("");
      }
      const ticketId = (date, phone) =>
        `${date}_${mix(date + "|" + phone + "|" + ID_SALT)}`;

      /* 픽업 시간 + 유예시간이 지났는지 */
      function isExpired(t, now = new Date()) {
        if (!t || t.received || t.cancelled) return false;
        if (t.date !== todayStr(now)) return true;
        if (!t.pickupAt) return false;
        const [hh, mm] = String(t.pickupAt).split(":").map(Number);
        if (Number.isNaN(hh) || Number.isNaN(mm)) return false;
        const nowMin = now.getHours() * 60 + now.getMinutes();
        return nowMin > hh * 60 + mm + CANCEL_GRACE_MIN;
      }
      // PICKUP_HOUR 는 13.5(1시 30분)처럼 소수점을 쓸 수 있으므로 분 단위로 비교합니다.
      function pickupTimeReached() {
        const now = new Date();
        return (
          now.getHours() * 60 + now.getMinutes() >= Math.round(PICKUP_HOUR * 60)
        );
      }

      /* ---------- 확인창 ---------- */
      let cfResolve = null;
      function confirmBox(title, msg) {
        setTxt("cfTitle", title);
        setTxt("cfMsg", msg);
        $("confirmModal").classList.add("on");
        return new Promise((res) => {
          cfResolve = res;
        });
      }
      function closeConfirm(v) {
        $("confirmModal").classList.remove("on");
        if (cfResolve) {
          cfResolve(v);
          cfResolve = null;
        }
      }
      $("cfOk").addEventListener("click", () => closeConfirm(true));
      $("cfCancel").addEventListener("click", () => closeConfirm(false));
      $("confirmModal").addEventListener("click", (e) => {
        if (e.target.id === "confirmModal") closeConfirm(false);
      });

      /* ---------- 오늘 상태(수동 마감 + 자동 소진) ---------- */
      let DAY = { closedTypes: [], counts: {} };

      // 그날의 한도 — 관리자가 수정한 값이 있으면 그것을, 없으면 기본값을 씁니다.
      const limitsOf = (data) => ({ ...FRUIT_LIMITS, ...(data?.limits || {}) });
      const limitOf = (f) => limitsOf(DAY)[f] || 0;
      const remainOf = (f) => Math.max(0, limitOf(f) - (DAY.counts?.[f] || 0));
      const maxQtyOf = (f) => Math.min(MAX_PER_TYPE, remainOf(f));

      function soldOutList(counts, data) {
        const lim = limitsOf(data);
        return FRUITS.filter((f) => (counts?.[f] || 0) >= (lim[f] || 0));
      }
      function blockedList(data) {
        const closed = Array.isArray(data?.closedTypes) ? data.closedTypes : [];
        return [...new Set([...closed, ...soldOutList(data?.counts, data)])];
      }
      const allClosed = (list) => FRUITS.every((f) => list.includes(f));

      function applyBlocked(list) {
        document.querySelectorAll(".type").forEach((el) => {
          const k = el.dataset.k;
          const isClosed = list.includes(k);
          el.classList.toggle("closed", isClosed);
          if (isClosed) qty[k] = 0;
          else qty[k] = Math.min(qty[k] || 0, maxQtyOf(k));
        });
        renderTypes();
      }
      async function refreshDay() {
        try {
          const snap = await getDoc(counterRefOf(todayStr()));
          DAY = snap.exists() ? snap.data() : { closedTypes: [], counts: {} };
        } catch (e) {
          console.error(e);
        }
        const list = blockedList(DAY);
        applyBlocked(list);
        return list;
      }

      /* 마감 상태를 실시간으로 따라갑니다.
         관리자가 마감을 풀거나, 예약 취소·삭제로 재고가 돌아오면
         손님이 화면을 켜 둔 상태에서도 곧바로 다시 열립니다. */
      const isVisible = (el) => el && !el.classList.contains("hidden");
      function watchDay() {
        try {
          onSnapshot(
            counterRefOf(todayStr()),
            (snap) => {
              DAY = snap.exists()
                ? snap.data()
                : { closedTypes: [], counts: {} };
              const list = blockedList(DAY);
              applyBlocked(list);

              // 이미 번호표를 받은 손님의 화면은 건드리지 않습니다.
              if (isVisible($("screen-result"))) return;
              renderDayNotice();

              // 예약 도중 전 품목이 마감되면 첫 화면으로 되돌립니다.
              if (
                allClosed(list) &&
                (isVisible($("screen-form")) || isVisible($("screen-code")))
              ) {
                hide($("screen-form"));
                hide($("screen-code"));
                show($("screen-phone"));
                restartFade($("screen-phone"));
              }
            },
            (e) => console.error("마감 상태 구독 실패", e),
          );
        } catch (e) {
          console.error(e);
        }
      }

      /* ---------- 예약 마감 시간 ---------- */
      // RESERVE_CUTOFF_HOUR(기본 19 = 오후 7시) 이후에는 새 예약을 받지 않습니다.
      function afterCutoff(now = new Date()) {
        return (
          now.getHours() * 60 + now.getMinutes() >=
          Math.round(RESERVE_CUTOFF_HOUR * 60)
        );
      }
      // 새 번호로 예약을 시작할 수 있는 상태인지
      function newReservationBlocked() {
        if (afterCutoff()) return "cutoff";
        if (allClosed(blockedList(DAY))) return "soldout";
        return "";
      }
      function renderDayNotice() {
        const el = $("dayNotice");
        const why = newReservationBlocked();
        if (!why) {
          el.classList.add("hidden");
          el.innerHTML = "";
          return;
        }
        const head =
          why === "cutoff"
            ? T.noticeCutoff(T.hourFmt(RESERVE_CUTOFF_HOUR))
            : T.noticeSoldOut;
        el.innerHTML = `${head}<br>${T.noticeOnsite(T.hourFmt(ONSITE_SALE_HOUR))}<br>${T.lookupOnly}`;
        el.classList.remove("hidden");
      }

      /* ---------- STEP 1 : 전화번호 + 동의 ---------- */
      const phoneEl = $("phone");
      phoneEl.addEventListener("input", () => {
        phoneEl.value = fmtPhone(phoneEl.value);
      });
      phoneEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") onCheckPhone();
      });
      $("phoneBtn").addEventListener("click", onCheckPhone);

      const agreeEl = $("agree");
      agreeEl.checked = false;
      function syncAgree() {
        $("phoneBtn").disabled = !agreeEl.checked;
        if (agreeEl.checked) $("phoneHint").textContent = "";
      }
      agreeEl.addEventListener("change", syncAgree);
      syncAgree();

      $("consentToggle").addEventListener("click", () => {
        const opened = $("consentBody").classList.toggle("hidden");
        setTxt("consentToggle", opened ? T.consentView : T.consentHide);
      });

      let currentPhone = "";

      async function onCheckPhone() {
        const p = digits(phoneEl.value);
        $("phoneHint").textContent = "";
        if (p.length < 10) {
          $("phoneHint").textContent = T.phoneInvalid;
          return;
        }
        if (!agreeEl.checked) {
          $("phoneHint").textContent = T.consentRequired;
          return;
        }
        currentPhone = p;
        busy(true);
        try {
          const existing = await findTodayTicket(p);
          if (existing) {
            busy(false);
            await handleRevisit(existing);
            return;
          }
          await refreshDay();
          busy(false);
          const why = newReservationBlocked();
          if (why) {
            // 새 번호는 예약을 시작할 수 없지만, 화면은 그대로 두어
            // 기존 번호표 조회는 계속할 수 있게 합니다.
            renderDayNotice();
            $("phoneHint").textContent =
              why === "cutoff"
                ? T.noticeCutoff(T.hourFmt(RESERVE_CUTOFF_HOUR))
                : T.noticeSoldOut;
            return;
          }
          hide($("screen-phone"));
          show($("screen-form"));
          restartFade($("screen-form"));
        } catch (e) {
          busy(false);
          console.error(e);
          $("phoneHint").textContent = T.errorGeneric;
        }
      }

      // 자기 번호표 문서 1개만 직접 열어봅니다. (전체 목록 조회는 규칙에서 차단)
      async function findTodayTicket(phone) {
        const id = ticketId(todayStr(), phone);
        const snap = await getDoc(ticketRefOf(todayStr(), id));
        return snap.exists() ? { id, ...snap.data() } : null;
      }

      /* ---------- STEP 2 : 종류 수량 ---------- */
      const qty = {};
      FRUITS.forEach((f) => {
        qty[f] = 0;
      });

      function renderTypes() {
        document.querySelectorAll(".type").forEach((el) => {
          const k = el.dataset.k;
          const n = qty[k] || 0;
          const closed = el.classList.contains("closed");
          el.classList.toggle("on", n > 0 && !closed);
          el.querySelector(".q").textContent = closed
            ? T.soldOutBadge
            : n > 0
              ? n
              : "";
        });
        renderBags();
      }

      document.querySelectorAll(".type").forEach((el) => {
        el.addEventListener("click", () => {
          if (el.classList.contains("closed")) return;
          const k = el.dataset.k;
          const max = maxQtyOf(k);
          qty[k] = max <= 0 ? 0 : ((qty[k] || 0) + 1) % (max + 1);
          $("formHint").textContent = "";
          renderTypes();
        });
      });

      /* ---------- STEP 2 : 포장 ---------- */
      const bagQty = {};
      BAGS.forEach((b) => {
        bagQty[b.k] = 0;
      });

      function renderBags() {
        const cakes = cakeCount(qty);
        document.querySelectorAll(".bag").forEach((el) => {
          const k = el.dataset.b;
          const spec = BAGS.find((b) => b.k === k) || {};
          let locked = false;
          if (spec.perCakes) locked = Math.floor(cakes / spec.perCakes) < 1;
          if (spec.requiresCooler) locked = (bagQty.cooler || 0) < 1;
          if (locked) bagQty[k] = 0;
          else if (spec.perCakes)
            bagQty[k] = Math.min(bagQty[k] || 0, Math.floor(cakes / spec.perCakes));
          el.classList.toggle("off", locked);
          el.classList.toggle("on", bagQty[k] > 0);
          el.querySelector(".bq").textContent = bagQty[k] > 0 ? bagQty[k] : "";
        });
        const bagCapacity =
          (bagQty.free || 0) * 1 +
          (bagQty.shopping || 0) * 2 +
          (bagQty.cooler || 0) * COOLER_CAPACITY +
          (bagQty.fruitbox || 0) * FRUITBOX_PER;
        const needMore = cakes - bagCapacity > 0;
        $("bagNoteCooler").classList.toggle("hidden", !needMore);
        updateTotal();
      }

      function currentBags() {
        const bags = {};
        BAGS.forEach((b) => {
          bags[b.k] = bagQty[b.k] || 0;
        });
        return bags;
      }
      function currentItems() {
        const items = {};
        FRUITS.forEach((f) => {
          if (qty[f] > 0) items[f] = qty[f];
        });
        return items;
      }
      function updateTotal() {
        const txt = T.priceFmt(calcTotal(currentItems(), currentBags()));
        setTxt("estTotal", txt);
        setTxt("estTotal2", txt);
      }

      document.querySelectorAll(".bag").forEach((el) => {
        el.addEventListener("click", () => {
          if (el.classList.contains("off")) return;
          const k = el.dataset.b;
          const spec = BAGS.find((b) => b.k === k) || {};
          const cakes = cakeCount(qty);
          if (spec.perCakes) {
            // 케이크 4개당 1개 — 최대치까지 늘어난 뒤 다시 0으로 돌아갑니다.
            const max = Math.floor(cakes / spec.perCakes);
            bagQty[k] = max <= 0 ? 0 : ((bagQty[k] || 0) + 1) % (max + 1);
          } else {
            bagQty[k] = Math.min((bagQty[k] || 0) + 1, 20);
          }
          renderBags();
        });
      });
      $("bagReset").addEventListener("click", () => {
        BAGS.forEach((b) => {
          bagQty[b.k] = 0;
        });
        renderBags();
      });

      /* ---------- STEP 2 : 픽업 시간 ---------- */
      let pickupAt = "";
      $("timeToggle").addEventListener("click", () => {
        const opening = $("slots").classList.contains("hidden");
        if (opening) refreshSlots();
        $("slots").classList.toggle("hidden", !opening);
        $("timeToggle").classList.toggle("open", opening);
      });
      /* 이미 지난 시간대는 고를 수 없게 합니다.
         (예: 14시 01분이면 14:00 슬롯은 선택 불가) */
      function refreshSlots() {
        const now = new Date();
        const nowMin = now.getHours() * 60 + now.getMinutes();
        let clearedSelected = false;
        document.querySelectorAll(".slot").forEach((el) => {
          const [hh, mm] = String(el.dataset.t).split(":").map(Number);
          const past = hh * 60 + mm < nowMin;
          el.classList.toggle("past", past);
          if (past && el.classList.contains("on")) {
            el.classList.remove("on");
            clearedSelected = true;
          }
        });
        if (clearedSelected) {
          pickupAt = "";
          $("timeToggleText").textContent = T.pickupTimeChoose;
          $("timeToggleText").classList.add("ph");
          $("timeToggle").classList.remove("chosen");
        }
      }
      refreshSlots();
      setInterval(refreshSlots, 30000);

      document.querySelectorAll(".slot").forEach((el) => {
        el.addEventListener("click", () => {
          if (el.classList.contains("past")) return;
          pickupAt = el.dataset.t;
          document
            .querySelectorAll(".slot")
            .forEach((s) => s.classList.toggle("on", s === el));
          $("timeToggleText").textContent = pickupAt;
          $("timeToggleText").classList.remove("ph");
          $("timeToggle").classList.add("chosen");
          $("slots").classList.add("hidden");
          $("timeToggle").classList.remove("open");
          $("formHint").textContent = "";
        });
      });

      /* ---------- STEP 2 → STEP 3 ---------- */
      $("formBack").addEventListener("click", () => {
        hide($("screen-form"));
        show($("screen-phone"));
      });
      $("formBtn").addEventListener("click", () => {
        $("formHint").textContent = "";
        if (cakeCount(qty) === 0) {
          $("formHint").textContent = T.typeRequired;
          return;
        }
        if (!pickupAt) {
          $("formHint").textContent = T.pickupTimeRequired;
          return;
        }
        updateTotal();
        hide($("screen-form"));
        show($("screen-code"));
        restartFade($("screen-code"));
      });

      /* ---------- STEP 3 : 입장코드 ---------- */
      const codeEl = $("entryCode");
      codeEl.addEventListener("input", () => {
        codeEl.value = digits(codeEl.value).slice(0, 4);
      });
      codeEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") onIssue();
      });
      $("codeBack").addEventListener("click", () => {
        hide($("screen-code"));
        show($("screen-form"));
      });
      $("codeBtn").addEventListener("click", onIssue);

      async function onIssue() {
        const code = digits(codeEl.value);
        $("codeHint").textContent = "";
        if (cakeCount(qty) === 0 || !pickupAt) {
          hide($("screen-code"));
          show($("screen-form"));
          $("formHint").textContent = cakeCount(qty)
            ? T.pickupTimeRequired
            : T.typeRequired;
          return;
        }
        if (code.length !== 4) {
          $("codeHint").textContent = T.codeRequired;
          return;
        }

        const items = currentItems();
        const bags = currentBags();

        busy(true);
        try {
          const result = await createTicket({
            phone: currentPhone,
            items,
            bags,
            pickupAt,
            code,
          });
          busy(false);
          if (result.existing) {
            await handleRevisit(result.existing);
            return;
          }
          if (result.blocked === "full" || result.blocked === "cutoff") {
            // 마감·예약 종료 : 첫 화면으로 돌려보내고 안내를 띄웁니다.
            await refreshDay();
            hide($("screen-code"));
            hide($("screen-form"));
            show($("screen-phone"));
            restartFade($("screen-phone"));
            renderDayNotice();
            $("phoneHint").textContent =
              result.blocked === "cutoff"
                ? T.noticeCutoff(T.hourFmt(RESERVE_CUTOFF_HOUR))
                : T.noticeSoldOut;
            return;
          }
          if (result.blocked === "type") {
            await refreshDay();
            hide($("screen-code"));
            show($("screen-form"));
            $("formHint").textContent = T.typeClosedError;
            return;
          }
          if (result.blocked === "code") {
            $("codeHint").textContent = T.codeWrong;
            codeEl.value = "";
            return;
          }
          renderResult({
            id: result.id,
            state: "new",
            ticketNo: result.ticketNo,
            items,
            bags,
            pickupAt,
            total: calcTotal(items, bags),
            time: new Date(),
          });
        } catch (e) {
          busy(false);
          console.error(e);
          $("codeHint").textContent = T.errorIssue;
        }
      }

      async function createTicket({ phone, items, bags, pickupAt, code }) {
        const date = todayStr();
        const id = ticketId(date, phone);
        const counterRef = counterRefOf(date);
        const ticketRef = ticketRefOf(date, id);
        return await runTransaction(db, async (tx) => {
          const cs = await tx.get(counterRef);
          const ts = await tx.get(ticketRef);
          // 같은 번호로 이미 오늘 번호표가 있으면 새로 만들지 않습니다.
          if (ts.exists()) return { existing: { id, ...ts.data() } };
          const data = cs.exists() ? cs.data() : {};

          if (afterCutoff()) return { blocked: "cutoff" };
          const blocked = blockedList(data);
          if (allClosed(blocked)) return { blocked: "full" };

          const counts = { ...(data.counts || {}) };
          for (const f of FRUITS) {
            const n = items[f] || 0;
            if (!n) continue;
            if (blocked.includes(f)) return { blocked: "type" };
            if ((counts[f] || 0) + n > (limitsOf(data)[f] || 0))
              return { blocked: "type" };
            counts[f] = (counts[f] || 0) + n;
          }

          // 오늘의 입장코드 (없으면 새로 만들고 이번 시도는 되돌립니다)
          const savedCode = data.entryCode ? String(data.entryCode) : "";
          if (!savedCode) {
            tx.set(counterRef, { entryCode: gen4() }, { merge: true });
            return { blocked: "code" };
          }
          if (savedCode !== String(code)) return { blocked: "code" };

          const next = (data.last || 0) + 1;
          tx.set(counterRef, { last: next, counts }, { merge: true });
          tx.set(ticketRef, {
            phone,
            items,
            bags,
            pickupAt,
            total: calcTotal(items, bags),
            date,
            ticketNo: next,
            received: false,
            receivedAt: null,
            cancelled: false,
            createdAt: serverTimestamp(),
            // 개인정보 수집·이용 동의 기록 (개인정보보호법 입증용)
            consent: true,
            consentAt: serverTimestamp(),
            consentVersion: `phone-only-v1`,
            personalDeleted: false,
          });
          return { ticketNo: next, id };
        });
      }

      /* 예약을 취소 처리하면서 그날의 판매 수량에서도 빼줍니다.
         → 취소된 만큼 해당 과일이 다시 열립니다. (이미 취소된 건은 건드리지 않음) */
      async function releaseCancelled(t) {
        const tRef = ticketRefOf(t.date || todayStr(), t.id);
        const cRef = counterRefOf(t.date || todayStr());
        return await runTransaction(db, async (tx) => {
          const ts = await tx.get(tRef);
          if (!ts.exists()) return false;
          const cur = ts.data();
          if (cur.cancelled) return false;
          const cs = await tx.get(cRef);
          const counts = { ...((cs.exists() && cs.data().counts) || {}) };
          const items = cur.items || {};
          FRUITS.forEach((f) => {
            const n = items[f] || 0;
            if (n) counts[f] = Math.max(0, (counts[f] || 0) - n);
          });
          tx.set(cRef, { counts }, { merge: true });
          tx.update(tRef, {
            cancelled: true,
            cancelledAt: serverTimestamp(),
          });
          return true;
        });
      }

      /* ---------- 재방문 ---------- */
      async function handleRevisit(t) {
        if (t.received) {
          renderResult({
            ...t,
            state: "already",
            time: t.createdAt,
            receivedTime: t.receivedAt,
          });
          return;
        }
        if (t.cancelled || isExpired(t)) {
          // 픽업 시간이 지난 예약은 취소 처리하고 전화번호를 지웁니다.
          if (!t.cancelled) {
            releaseCancelled(t).catch((e) => console.error(e));
          }
          renderResult({ ...t, state: "cancelled", time: t.createdAt });
          return;
        }
        renderResult({ ...t, state: "waiting", time: t.createdAt });
      }

      /* ---------- 픽업 완료 ---------- */
      async function onPickupDone(id) {
        const ok = await confirmBox(T.pickupConfirmTitle, T.pickupConfirmMsg);
        if (!ok) return;
        // 화면은 즉시 완료로 바꾸고, 삭제는 뒤에서 처리합니다.
        setTxt("resState", T.stateReceived);
        $("resState").className = "state";
        setTxt("resNote", T.noteReceived);
        const box = $("doneBox");
        if (box) box.remove();
        // 전화번호는 이 자리에서 지우지 않고, 그날 밤 PURGE_HOUR 에
        // 관리자 화면에서 일괄 파기합니다.
        updateDoc(ticketRefOf(todayStr(), id), {
          received: true,
          receivedAt: serverTimestamp(),
        }).catch((e) => console.error(e));
      }

      /* ---------- 결과 ---------- */
      function renderResult(o) {
        const el = $("screen-result");
        const items = o.items || {};
        let label,
          note,
          gray = false,
          red = false,
          showDone = false;

        if (o.state === "new") {
          label = T.stateNew;
          note = T.noteNew(PICKUP_HOUR);
          showDone = !o.cancelled;
        } else if (o.state === "waiting") {
          label = T.stateWaiting;
          note = T.noteWaiting(PICKUP_HOUR);
          gray = true;
          showDone = !o.cancelled;
        } else if (o.state === "received") {
          label = T.stateReceived;
          note = T.noteReceived;
        } else if (o.state === "cancelled") {
          label = T.stateCancelled;
          note = T.noteCancelled;
          red = true;
        } else {
          label = T.stateAlready;
          note = T.noteAlready(o.receivedTime ? fmtTime(o.receivedTime) : "");
          gray = true;
        }

        const ready = pickupTimeReached();
        const doneHtml =
          showDone && ready
            ? `<div id="doneBox">
      <button class="btn" id="doneBtn">${T.pickupDone}</button>
      <p class="doneNote">${T.pickupDoneNote(T.hourFmt(PURGE_HOUR))}</p>
    </div>`
            : "";

        el.innerHTML = `
    <p class="state${gray ? " gray" : ""}${red ? " red" : ""}" id="resState">${label}</p>
    <p class="ticketBig${red ? " off" : ""}">${o.ticketNo ?? "-"}</p>
    <div class="rows">
      <div class="row"><span class="k">${T.fieldType}</span><span class="v">${esc(itemText(items))}</span></div>
      <div class="row"><span class="k">${T.fieldBag}</span><span class="v">${esc(bagText(o.bags))}</span></div>
      <div class="row"><span class="k">${T.fieldPickup}</span><span class="v">${esc(o.pickupAt || "—")}</span></div>
      <div class="row"><span class="k">${T.fieldTime}</span><span class="v">${fmtTime(o.time)}</span></div>
    </div>
    <div class="totalbox">
      <span class="tl">${T.estTotal}</span>
      <span class="tv">${T.priceFmt(o.total ?? calcTotal(items, o.bags))}</span>
    </div>
    <p class="note" id="resNote">${note}</p>
    ${o.state === "received" || o.state === "cancelled" || o.state === "already" ? "" : `<p class="resNotice">${T.noticeShowScreen}</p>`}
    ${doneHtml}
  `;
        if (showDone && ready) {
          $("doneBtn").addEventListener("click", () => onPickupDone(o.id));
        }
        hide($("screen-phone"));
        hide($("screen-form"));
        hide($("screen-code"));
        hide($("t-footer"));
        show(el);
        restartFade(el);
      }

      function showClosed() {
        hide($("screen-phone"));
        hide($("screen-form"));
        hide($("screen-code"));
        hide($("screen-result"));
        hide($("t-footer"));
        show($("screen-closed"));
        restartFade($("screen-closed"));
      }

      /* ---------- 시작 ---------- */
      async function start() {
        try {
          await refreshDay();
          watchDay();
        } catch (e) {
          console.error(e);
        }
        // 모두 마감이거나 예약 시간이 지났어도, 이미 받은 번호표는
        // 조회할 수 있어야 하므로 전화번호 화면은 항상 띄웁니다.
        renderDayNotice();
        setInterval(renderDayNotice, 60000);
        busy(false);
        show($("screen-phone"));
        show($("t-footer"));
      }

      renderTypes();
      start();
    </script>
  </body>
</html>
